location = /pay-swagger {
    return 301 /pay-swagger/;
}

location ^~ /pay-swagger/api/ {
    proxy_pass http://127.0.0.1:3200/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /pay-swagger/docs/ {
    proxy_pass http://127.0.0.1:3200/docs/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /pay-swagger/admin/ {
    alias /var/www/pay-swagger/apps/admin-web/dist/;
    index index.html;
    try_files $uri $uri/ /pay-swagger/admin/index.html;
}

location ^~ /pay-swagger/ {
    alias /var/www/pay-swagger/apps/customer-web/dist/;
    index index.html;
    try_files $uri $uri/ /pay-swagger/index.html;
}
